<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- App-ikon: sol bakom moln på en blå himmelsgradient. Full-bleed – launchern maskar formen. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f93ec"/>
      <stop offset="0.55" stop-color="#2160bf"/>
      <stop offset="1" stop-color="#15346e"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#fff5c2"/>
      <stop offset="0.5" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#ff9f1c"/>
    </radialGradient>
    <radialGradient id="sunglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd166" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d3dcea"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0b2350" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#sky)"/>

  <!-- solglöd -->
  <circle cx="206" cy="196" r="150" fill="url(#sunglow)"/>

  <!-- strålar -->
  <g stroke="#ffd166" stroke-width="16" stroke-linecap="round" opacity="0.95">
    <line x1="206" y1="86" x2="206" y2="60"/>
    <line x1="206" y1="306" x2="206" y2="332"/>
    <line x1="96" y1="196" x2="70" y2="196"/>
    <line x1="316" y1="196" x2="342" y2="196"/>
    <line x1="128" y1="118" x2="110" y2="100"/>
    <line x1="284" y1="118" x2="302" y2="100"/>
    <line x1="128" y1="274" x2="110" y2="292"/>
    <line x1="284" y1="274" x2="302" y2="292"/>
  </g>

  <!-- sol -->
  <circle cx="206" cy="196" r="86" fill="url(#sun)"/>

  <!-- moln -->
  <g fill="url(#cloud)" filter="url(#shadow)" transform="translate(120 190) scale(5.2)">
    <rect x="14" y="34" width="40" height="12" rx="7"/>
    <circle cx="26" cy="32" r="10"/>
    <circle cx="38" cy="28" r="13"/>
    <circle cx="46" cy="36" r="9"/>
  </g>
</svg>
